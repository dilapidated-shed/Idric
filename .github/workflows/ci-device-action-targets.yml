name: Device action target matrix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  device-action-targets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Idriç
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require every device action on ARM Linux, x86 Linux, and Android
        run: sh _/check-device-action-targets.sh
