name: Edric wrapper

on:
  push:
    paths:
      - 'edric'
      - 'scripts/ensure-chez.sh'
      - 'bootstrap/idris2_app/**'
      - 'src/**'
      - 'libs/prelude/**'
      - 'tests/idris2/basic/edric007/**'
      - 'support/chez/**'
      - '.github/workflows/ci-edric-wrapper.yml'
  pull_request:
    paths:
      - 'edric'
      - 'scripts/ensure-chez.sh'
      - 'bootstrap/idris2_app/**'
      - 'src/**'
      - 'libs/prelude/**'
      - 'tests/idris2/basic/edric007/**'
      - 'support/chez/**'
      - '.github/workflows/ci-edric-wrapper.yml'

jobs:
  private-scheme-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify private Scheme owns bootstrap PATH
        shell: bash
        run: |
          set -euo pipefail

          toolchain="$RUNNER_TEMP/edric-toolchain"
          fake_make="$RUNNER_TEMP/edric-make"
          mkdir -p "$toolchain/bin"

          cat > "$toolchain/bin/scheme" <<'SCHEME'
          #!/bin/sh
          cat >/dev/null
          printf '#t\n'
          SCHEME
          chmod +x "$toolchain/bin/scheme"

          cat > "$fake_make" <<'MAKE'
          #!/bin/sh
          set -eu
          expected="$EDRIC_TOOLCHAIN_DIR/bin/scheme"
          actual=$(command -v scheme || true)
          if [ "$actual" != "$expected" ]; then
              echo "expected private scheme at $expected, got ${actual:-<none>}" >&2
              exit 1
          fi
          case " $* " in
              *" SCHEME=$expected "*) ;;
              *)
                  echo "bootstrap did not receive SCHEME=$expected: $*" >&2
                  exit 1
                  ;;
          esac
          MAKE
          chmod +x "$fake_make"

          EDRIC_TOOLCHAIN_DIR="$toolchain" MAKE="$fake_make" ./edric bootstrap

  source-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Float16 Prelude to avoid the wide primitive
        shell: bash
        run: |
          set -euo pipefail
          file=libs/prelude/Prelude/Float16.idr
          ! grep -q 'Double' "$file"
          ! grep -q 'prim__cast_FloatInteger' "$file"
          grep -q 'float16Carrier : Float' "$file"
          grep -q 'prim__add_Float' "$file"
          grep -q 'prim__div_Float' "$file"
          grep -q 'FloatType' src/Core/TT/Primitive.idr
          grep -q 'blodwen-float32' support/chez/support.ss

      - name: Install Chez Scheme
        run: |
          sudo apt-get update
          sudo apt-get install -y chezscheme

      - name: Bootstrap compiler
        run: make bootstrap SCHEME=scheme

      - name: Check Idriç Float16 coercion source profile
        run: make test only=idris2/basic/edric007
