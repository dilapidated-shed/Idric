name: Import swerc baseline once

on:
  push:
    branches:
      - framework/html
    paths:
      - .github/workflows/import-swerc-once.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: framework/html
          fetch-depth: 0

      - name: Import pinned swerc tree
        shell: bash
        run: |
          set -euo pipefail

          expected=cfa3a460bd6c9a7e07fa85d760474c37c34cb160

          git remote add swerc https://git.suckless.org/swerc
          git fetch --depth=1 swerc master

          actual="$(git rev-parse FETCH_HEAD)"
          test "$actual" = "$expected"

          mkdir -p frameworks/html
          git read-tree --prefix=frameworks/html/swerc/ -u FETCH_HEAD
          git rm .github/workflows/import-swerc-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Import swerc HTML framework baseline"
          git push origin HEAD:framework/html
